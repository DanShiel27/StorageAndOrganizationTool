<form class="wrapper" [formGroup]="roomForm" (ngSubmit)="addRoom()">

    <div class="row">
        <mat-form-field class="upperRowItems">
            <mat-label>Name: </mat-label>
            <input matInput formControlName="name" />
        </mat-form-field>
            
        <mat-form-field class="upperRowItems">
            <mat-label>Description: </mat-label>
            <input matInput formControlName="description"/>
        </mat-form-field>

        <div class="upperRowItems">
            <button mat-raised-button type="submit" class="submitButton">submit</button>
        </div>
    </div>
    
    <div class="row">
        <mat-form-field class="pictureSelector">
            <input matInput formControlName="pictureNumber" style="display:none"/>
            <mat-radio-group class="pictureContainer" formControlName="pictureNumber">
                @for (picture of pictureList; track picture){
                    <mat-label class="pictureItem">
                        <mat-radio-button [value]="picture">
                            <mat-card>
                                <mat-card-header class="pictureTitle">
                                    <mat-card-title>Picture {{picture}}</mat-card-title>
                                </mat-card-header>
                                <img mat-card-image src="/assets/RoomImage.jpg" alt="Picture of room">
                            </mat-card>
                        </mat-radio-button>
                    </mat-label>
                }
            </mat-radio-group>
        </mat-form-field>
    </div>
</form>
